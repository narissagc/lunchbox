  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'Nunito', sans-serif;
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --surface2: #F3F2EF;
    --border: rgba(0,0,0,0.09);
    --border-med: rgba(0,0,0,0.14);
    --text-primary: #1C1B18;
    --text-secondary: #6B6A65;
    --text-hint: #A4A39F;
    
    /* Updated Palette Integration */
    --purple-50: #ff9aa2;  /* Pastel Pink Accent */
    --purple-600: #e27c85; 
    --purple-800: #7a1f29;
    
    --teal-50: #b5ead7;    /* Pastel Mint Green */
    --teal-600: #5cb395;
    --teal-800: #0c513f;
    
    --amber-50: #ffdac1;   /* Pastel Peach */
    --amber-600: #d99a73;
    --amber-800: #704214;
    
    --blue-50: #c7ceff;    /* Pastel Periwinkle Blue */
    --blue-600: #8fa0e6;
    --blue-800: #1a2b75;
    
    --gray-50: #f7f3c7;    /* Pastel Yellow */
    --gray-600: #666127;
    
    --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1917; --surface: #242321; --surface2: #2E2D2A;
      --border: rgba(255,255,255,0.08); --border-med: rgba(255,255,255,0.14);
      --text-primary: #F0EFE9; --text-secondary: #A4A39F; --text-hint: #6B6A65;
      
      /* Dark mode contrast variants based on custom palette */
      --purple-50: #40151a; 
      --purple-600: #ff9aa2; 
      --purple-800: #ffcbd0;
      
      --teal-50: #123328; 
      --teal-600: #b5ead7; 
      --teal-800: #dbf6ed;
      
      --amber-50: #3a2510; 
      --amber-600: #ffdac1; 
      --amber-800: #ffeadd;
      
      --blue-50: #1a2040; 
      --blue-600: #c7ceff; 
      --blue-800: #e3e6ff;
      
      --gray-50: #302d0b; 
      --gray-600: #f7f3c7;
    }
  }

  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text-primary); display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }

  .phone-wrap { width: 100%; max-width: 430px; min-height: 100vh; height: 100vh; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }

  /* VIEWS */
  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }
