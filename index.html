<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Daycare Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'Nunito', sans-serif;
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --surface2: #F6F4EE;
    --border: rgba(0,0,0,0.06);
    --border-med: rgba(0,0,0,0.12);
    --text-primary: #2D2B2A;
    --text-secondary: #6E6B68;
    --text-hint: #A6A39F;
    
    /* YOUR PASTEL CODES INTEGRATED NATIVELY */
    /* Main Theme / Daycare Badges / Active Tabs: Pink Sauce (#ff9aa2) */
    --purple-50: #FFF0F1; 
    --purple-600: #ff9aa2; 
    --purple-800: #A84E55;
    
    /* Lunch: Mint Olive Rings (#b5ead7) */
    --teal-50: #EFFFFB; 
    --teal-600: #89CEB6; 
    --teal-800: #3D7361;
    
    /* Morning Snack: Cream Crust / Soft Yellow (#ffdac1 & #f7f3c7) */
    --amber-50: #FFF9E6; 
    --amber-600: #ffdac1; 
    --amber-800: #947158;
    
    /* Afternoon Snack: Periwinkle Sparkles (#c7ceff) */
    --blue-50: #F0F3FF; 
    --blue-600: #c7ceff; 
    --blue-800: #575E91;
    
    --gray-50: #F1EFE8; --gray-600: #5F5E5A;
    --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
    --shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1B1A; --surface: #262423; --surface2: #302E2C;
      --border: rgba(255,255,255,0.06); --border-med: rgba(255,255,255,0.12);
      --text-primary: #F5F4F0; --text-secondary: #A6A39F; --text-hint: #6E6B68;
      --purple-50: #3D292B; --purple-600: #FFB3B9; --purple-800: #FFE0E2;
      --teal-50: #203830; --teal-600: #ACE3D0; --teal-800: #D6F7ED;
      --amber-50: #382F27; --amber-600: #FFE1CC; --amber-800: #FFF0E6;
      --blue-50: #252A3D; --blue-600: #DEE2FF; --blue-800: #F0F2FF;
      --gray-50: #302E2C; --gray-600: #B4B2A9;
    }
  }

  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text-primary); display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }

  .phone-wrap { width: 100%; max-width: 430px; min-height: 100vh; height: 100vh; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }

  /* VIEWS */
  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }

  /* ── TOP NAV ── */
  .top-bar { background: var(--surface); padding: 16px 20px 14px; border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .app-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .day-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav-arrow { width: 38px; height: 38px; border-radius: 50%; border: 0.5px solid var(--border-med); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 18px; flex-shrink: 0; transition: background 0.12s; }
  .nav-arrow:hover { background: var(--surface2); }
  .day-center { text-align: center; flex: 1; }
  .day-name { font-size: 21px; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
  .day-meta { font-size: 13px; color: var(--text-secondary); margin-top: 3px; display: flex; align-items: center; gap: 7px; justify-content: center; }
  .week-badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: var(--purple-50); color: var(--purple-800); }
  .today-btn { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: var(--amber-50); color: var(--amber-800); border: none; cursor: pointer; font-family: var(--font); transition: background 0.12s; white-space: nowrap; }
  .today-btn:hover { background: var(--amber-600); color: #fff; }

  /* ── MEALS SCROLL ── */
  .meals-scroll { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

  /* ── MEAL CARD ── */
  .meal-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .meal-card-head { padding: 13px 16px 11px; display: flex; align-items: center; justify-content: space-between; }
  .meal-title-row { display: flex; align-items: center; gap: 10px; }
  .meal-icon { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .meal-icon.morning { background: var(--amber-50); color: var(--amber-800); }
  .meal-icon.lunch   { background: var(--teal-50); color: var(--teal-800); }
  .meal-icon.afternoon { background: var(--blue-50); color: var(--blue-800); }
  .meal-label { font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .meal-time-tag { font-size: 11px; color: var(--text-hint); font-weight: 500; }

  .card-section { padding: 0 16px 14px; }
  .card-divider { height: 0.5px; background: var(--border); margin: 0 16px 12px; }
  .section-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-hint); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

  /* daycare offered row */
  .daycare-offered { background: var(--purple-50); border-radius: var(--radius-sm); padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .daycare-offered-text { font-size: 13px; font-weight: 600; color: var(--purple-800); flex: 1; }
  .daycare-week-tag { font-size: 10px; font-weight: 700; color: var(--purple-600); opacity: 0.7; flex-shrink: 0; }

  /* chips */
  .chips-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
